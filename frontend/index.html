<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Live API endpoint for production deployment
      var isProduction = typeof window !== 'undefined' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
      if (isProduction) {
        window.__API_URL__ = window.__API_URL__ || 'https://vairavan-koil.onrender.com/api';
      }
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      // Silent Pre-Warm Ping & Keep-Alive: Immediately wakes up backend container on page load
      // and keeps it warm every 5 minutes while the browser tab remains open.
      (function() {
        var backendUrl = isProduction ? 'https://vairavan-koil.onrender.com/health' : 'http://localhost:4000/health';
        function pingServer() {
          try {
            fetch(backendUrl, { method: 'GET', cache: 'no-store' }).catch(function() {});
          } catch(e) {}
        }
        pingServer();
        setInterval(pingServer, 5 * 60 * 1000);
      })();
    </script>
    <title>Vairavan Kovil</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
